name: Publish SIAM UQ 2026 site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jupyter ipykernel
          pip install numpy scipy pandas matplotlib
          pip install -e ./classlib
          pip install git+https://github.com/QMCSoftware/qmcpy

      - name: Create qmcpy kernel
        run: |
          python -m ipykernel install --user --name qmcpy --display-name "qmcpy"

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render slides
        run: quarto render
        working-directory: slides

      - name: Render website
        run: quarto render

      - name: Stage slides into website output
        run: |
          mkdir -p _site/slides
          rsync -a --delete slides/_site/ _site/slides/

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

